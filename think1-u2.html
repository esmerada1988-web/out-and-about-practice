let state = {
  mode: 'flashcard', topic: 'all', currentQuestions: [], currentIdx: 0,
  score: 0, correct: 0, wrong: 0, wrongList: [],
  totalStars: parseInt(localStorage.getItem('think1_u2_stars') || '0'),
  modeLabel: '', topicLabel: '全部', startTime: 0,
  matchSelected: null, matchCorrect: 0,
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function getFilteredVocab() { return state.topic==='all' ? vocabData : vocabData.filter(v=>v.section===state.topic); }
function getFilteredSentences() { return state.topic==='all' ? sentenceData : sentenceData.filter(s=>s.section===state.topic); }
function getFilteredFillBlanks() { return state.topic==='all' ? fillBlankData : fillBlankData.filter(f=>f.section===state.topic); }
function getFilteredMC() { return state.topic==='all' ? mcData : mcData.filter(m=>m.section===state.topic); }
function updateStars() {
  document.getElementById('starCount').textContent = state.totalStars;
  localStorage.setItem('think1_u2_stars', state.totalStars);
}

function startExercise() {
  state.currentIdx=0; state.score=0; state.correct=0; state.wrong=0; state.wrongList=[]; state.startTime=Date.now();
  if (state.mode==='flashcard') { state.currentQuestions=shuffle(getFilteredVocab()); state.modeLabel='翻卡记忆'; }
  else if (state.mode==='matching') { state.currentQuestions=shuffle(getFilteredVocab()).slice(0,8); state.matchCorrect=0; state.matchSelected=null; state.modeLabel='连线匹配'; }
  else if (state.mode==='fillblank') { state.currentQuestions=shuffle(getFilteredFillBlanks()); state.modeLabel='填空题'; }
  else if (state.mode==='multiplechoice') { state.currentQuestions=shuffle(getFilteredMC()); state.modeLabel='选择题'; }
  else if (state.mode==='ordering') { state.currentQuestions=shuffle(getFilteredSentences()); state.modeLabel='句子排序'; }
  renderQuestion();
}

function renderQuestion() {
  const area=document.getElementById('contentArea');
  if (state.currentIdx>=state.currentQuestions.length) { showResults(); return; }
  const pct=Math.round((state.currentIdx/state.currentQuestions.length)*100);
  const q=state.currentQuestions[state.currentIdx];
  let html=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="question-num">第 ${state.currentIdx+1} / ${state.currentQuestions.length} 题</div>`;
  if (state.mode==='flashcard') html+=renderFlashcard(q);
  else if (state.mode==='matching') html+=renderMatching();
  else if (state.mode==='fillblank') html+=renderFillBlank(q);
  else if (state.mode==='multiplechoice') html+=renderMC(q);
  else if (state.mode==='ordering') html+=renderOrdering(q);
  area.innerHTML=html;
  if (state.mode==='matching') attachMatchingEvents();
}

function renderFlashcard(q) {
  return `<div class="flashcard-container"><div class="flashcard" id="fc" onclick="flipCard()"><div class="flashcard-front"><div class="flashcard-word">${q.en}</div><div class="flashcard-type">${q.type}</div><div class="flashcard-section">📖 ${q.topic}</div></div><div class="flashcard-back"><div class="flashcard-meaning">${q.zh}</div><div class="flashcard-example">${q.example}</div><div class="flashcard-section">📖 ${q.topic}</div></div></div></div><div class="flashcard-hint">👆 点卡片翻转</div><div class="flashcard-actions"><button class="flashcard-btn btn-dont" onclick="fcMarkWrong()">😕 不认识</button><button class="flashcard-btn btn-know" onclick="fcMarkRight()">😊 认识</button></div>`;
}
function flipCard() { document.getElementById('fc').classList.toggle('flipped'); }
function fcMarkRight() { state.correct++; state.score++; state.totalStars++; updateStars(); state.currentIdx++; renderQuestion(); }
function fcMarkWrong() { const q=state.currentQuestions[state.currentIdx]; state.wrong++; state.wrongList.push({q:q.en,a:q.zh,mode:'翻卡'}); state.currentIdx++; renderQuestion(); }

function renderMatching() {
  const items=state.currentQuestions; const enItems=shuffle(items); const zhItems=shuffle(items);
  let html='<div style="text-align:center;font-size:14px;color:var(--c-text-light);margin-bottom:12px;">左边点英文，右边点中文配对</div><div class="matching-grid"><div style="display:flex;flex-direction:column;gap:10px;">';
  enItems.forEach((item,i)=>{ html+=`<div class="match-item" data-side="en" data-id="${i}" data-value="${item.en}">${item.en}</div>`; });
  html+='</div><div style="display:flex;flex-direction:column;gap:10px;">';
  zhItems.forEach((item,i)=>{ html+=`<div class="match-item" data-side="zh" data-id="${i}" data-value="${item.en}">${item.zh}</div>`; });
  html+='</div></div>'; return html;
}
function attachMatchingEvents() { document.querySelectorAll('.match-item').forEach(el=>el.addEventListener('click',()=>handleMatchClick(el))); }
function handleMatchClick(el) {
  if (el.classList.contains('correct')||el.classList.contains('wrong')) return;
  if (!state.matchSelected) { state.matchSelected=el; el.classList.add('selected'); }
  else {
    if (state.matchSelected.dataset.side===el.dataset.side) { state.matchSelected.classList.remove('selected'); state.matchSelected=el; el.classList.add('selected'); return; }
    if (state.matchSelected.dataset.value===el.dataset.value) {
      state.matchSelected.classList.remove('selected'); state.matchSelected.classList.add('correct'); el.classList.add('correct');
      state.correct++; state.score++; state.matchCorrect++; state.totalStars++; updateStars();
      if (state.matchCorrect>=state.currentQuestions.length) setTimeout(()=>{state.currentIdx=state.currentQuestions.length;showResults();},800);
    } else {
      const prev=state.matchSelected; prev.classList.remove('selected'); prev.classList.add('wrong'); el.classList.add('wrong');
      state.wrong++; state.wrongList.push({q:prev.dataset.value,a:'配对错误',mode:'连线'});
      setTimeout(()=>{prev.classList.remove('wrong');el.classList.remove('wrong');},600);
    }
    state.matchSelected=null;
  }
}

function renderFillBlank(q) {
  const parts=q.sentence.split('___');
  let html='<div class="fill-blank-question">';
  parts.forEach((part,i)=>{ html+=part; if(i<parts.length-1) html+=`<span class="blank" id="blank-${i}" onclick="clearBlank(${i})">______</span>`; });
  html+='</div>';
  if(q.hint) html+=`<div style="text-align:center;font-size:13px;color:var(--c-primary);margin-top:8px;">💡 ${q.hint}</div>`;
  const words=shuffle([q.answer,...getDistractors(q.answer)]);
  html+='<div class="word-bank">';
  words.forEach(w=>{ html+=`<span class="word-chip" onclick="fillWord('${w.replace(/'/g,"\\'")}', this)">${w}</span>`; });
  html+='</div><div style="text-align:center;margin-top:16px;"><button class="action-btn btn-primary" onclick="checkFillBlank('${q.answer.replace(/'/g,"\\'")}')">✅ 确认</button></div>';
  return html;
}
function getDistractors(answer) {
  const all=vocabData.map(v=>v.en).filter(w=>w!==answer);
  return shuffle(all).slice(0,4);
}
let currentFillWord='';
function fillWord(word,el) {
  document.querySelectorAll('.word-chip').forEach(c=>c.classList.remove('used'));
  el.classList.add('used'); currentFillWord=word;
  const blank=document.getElementById('blank-0');
  if(blank){blank.textContent=word;blank.classList.add('filled');}
}
function clearBlank(idx) {
  const blank=document.getElementById(`blank-${idx}`); blank.textContent='______'; blank.classList.remove('filled');
  document.querySelectorAll('.word-chip').forEach(c=>c.classList.remove('used')); currentFillWord='';
}
function checkFillBlank(answer) {
  const blank=document.getElementById('blank-0');
  if(!blank||!blank.classList.contains('filled')){alert('请先选择一个答案');return;}
  const userAnswer=blank.textContent;
  if(userAnswer.toLowerCase()===answer.toLowerCase()){
    blank.classList.add('correct'); state.correct++; state.score++; state.totalStars++; updateStars();
    setTimeout(()=>{state.currentIdx++;renderQuestion();},1000);
  } else {
    blank.classList.add('wrong'); state.wrong++; state.wrongList.push({q:`填空: ${state.currentQuestions[state.currentIdx].sentence}`,a:answer,mode:'填空'});
    setTimeout(()=>{blank.textContent=answer;blank.classList.remove('wrong');blank.classList.add('correct');setTimeout(()=>{state.currentIdx++;renderQuestion();},1500);},1200);
  }
}

function renderMC(q) {
  let html=`<div class="mc-question">${q.q}</div><div class="mc-options">`;
  q.options.forEach((opt,i)=>{ html+=`<div class="mc-option" data-idx="${i}" onclick="checkMC(${i},${q.answer})">${String.fromCharCode(65+i)}. ${opt}</div>`; });
  html+='</div>'; return html;
}
function checkMC(selected,correct) {
  const options=document.querySelectorAll('.mc-option'); options.forEach(o=>o.classList.add('disabled'));
  if(selected===correct){
    options[selected].classList.add('correct'); state.correct++; state.score++; state.totalStars++; updateStars();
    setTimeout(()=>{state.currentIdx++;renderQuestion();},1200);
  } else {
    options[selected].classList.add('wrong'); options[correct].classList.add('correct'); state.wrong++;
    state.wrongList.push({q:state.currentQuestions[state.currentIdx].q,a:String.fromCharCode(65+correct),mode:'选择'});
    setTimeout(()=>{state.currentIdx++;renderQuestion();},2000);
  }
}

let soTarget=[];
function renderOrdering(q) {
  soTarget=[]; const shuffled=shuffle(q.words);
  let html=`<div class="so-translation">💬 ${q.zh}</div><div class="so-target" id="soTarget"></div><div class="so-bank" id="soBank">`;
  shuffled.forEach((w,i)=>{ html+=`<span class="so-word" data-word="${w}" data-idx="${i}" onclick="moveToTarget(${i})">${w}</span>`; });
  html+='</div><div style="text-align:center;margin-top:16px;"><button class="action-btn btn-primary" onclick="checkOrdering()">✅ 确认</button><button class="action-btn btn-secondary" onclick="resetOrdering()">🔄 重置</button></div>';
  return html;
}
function moveToTarget(bankIdx) {
  const el=document.querySelector(`.so-word[data-idx="${bankIdx}"]`);
  if(!el||el.classList.contains('in-target'))return;
  soTarget.push(el.dataset.word); el.classList.add('in-target'); el.style.visibility='hidden'; renderTarget();
}
function removeFromTarget(idx) {
  const word=soTarget[idx]; soTarget.splice(idx,1);
  document.querySelectorAll('.so-word').forEach(el=>{if(el.dataset.word===word&&el.classList.contains('in-target')){el.classList.remove('in-target');el.style.visibility='visible';}});
  renderTarget();
}
function renderTarget() {
  const target=document.getElementById('soTarget');
  if(soTarget.length===0){target.innerHTML='<span style="color:var(--c-text-light);font-size:13px;">点下方单词组句</span>';return;}
  target.innerHTML=soTarget.map((w,i)=>`<span class="so-word" style="background:var(--c-green);" onclick="removeFromTarget(${i})">${w}</span>`).join('');
}
function checkOrdering() {
  const q=state.currentQuestions[state.currentIdx]; const userAnswer=soTarget.join(' '); const correctAnswer=q.words.join(' ');
  if(userAnswer===correctAnswer){
    state.correct++; state.score++; state.totalStars++; updateStars();
    document.getElementById('soTarget').style.borderColor='var(--c-green)';
    setTimeout(()=>{state.currentIdx++;renderQuestion();},1200);
  } else {
    document.getElementById('soTarget').style.borderColor='var(--c-red)'; state.wrong++;
    state.wrongList.push({q:`排序: ${q.zh}`,a:correctAnswer,mode:'排序'});
    setTimeout(()=>{soTarget=[...q.words];renderTarget();document.getElementById('soTarget').style.borderColor='var(--c-green)';setTimeout(()=>{state.currentIdx++;renderQuestion();},1500);},1500);
  }
}
function resetOrdering() {
  soTarget=[]; document.querySelectorAll('.so-word').forEach(el=>{el.classList.remove('in-target');el.style.visibility='visible';}); renderTarget();
}

function showResults() {
  const area=document.getElementById('contentArea');
  const total=state.currentQuestions.length;
  const pct=total>0?Math.round((state.correct/total)*100):0;
  const emoji=pct>=80?'🎉':pct>=60?'👍':pct>=40?'💪':'📖';
  const msg=pct>=80?'太棒了！':pct>=60?'不错！继续加油！':pct>=40?'还需练习哦！':'多看几遍词汇卡吧！';
  let wrongHtml='';
  if(state.wrongList.length>0){
    wrongHtml='<div class="wrong-list"><h3>❌ 错题回顾</h3>';
    state.wrongList.forEach(w=>{wrongHtml+=`<div class="wrong-item">${w.q} → <span class="correct-answer">${w.a}</span></div>`;});
    wrongHtml+='</div>';
  }
  const seconds=Math.round((Date.now()-state.startTime)/1000);
  const timeStr=`${Math.floor(seconds/60)}分${seconds%60}秒`;
  area.innerHTML=`<div class="results-screen"><div style="font-size:48px;">${emoji}</div><div class="results-score">${pct}<span class="total">分</span></div><div class="results-msg">${msg}</div><div class="results-detail"><div class="results-stat"><div class="num" style="color:var(--c-green)">${state.correct}</div><div class="label">答对</div></div><div class="results-stat"><div class="num" style="color:var(--c-red)">${state.wrong}</div><div class="label">答错</div></div><div class="results-stat"><div class="num" style="color:var(--c-orange)">+${state.score}</div><div class="label">本轮⭐</div></div><div class="results-stat"><div class="num" style="color:var(--c-purple)">${state.totalStars}</div><div class="label">总⭐</div></div><div class="results-stat"><div class="num" style="color:var(--c-blue)">${timeStr}</div><div class="label">用时</div></div></div>${wrongHtml}<div class="submit-section"><h3>📤 提交成绩给老师</h3><input type="text" id="studentName" placeholder="输入你的姓名" /><button class="copy-btn" onclick="generateScoreCode()">📤 提交成绩给老师</button><div class="code-output" id="codeOutput"></div><button class="copy-btn" id="copyBtn" style="display:none;background:var(--c-blue);" onclick="copyScoreCode()">📋 复制成绩码</button></div><div class="action-bar"><button class="action-btn btn-secondary" onclick="restartSameMode()">🔄 再练一次</button><button class="action-btn btn-primary" onclick="goHome()">🏠 返回首页</button></div></div>`;
}

async function generateScoreCode() {
  const name=document.getElementById('studentName').value.trim();
  if(!name){alert('请输入姓名');return;}
  var total=(state.correct||0)+(state.wrong||0);
  var pct=total>0?Math.round(state.correct/total*100):0;
  var scoreData={name:name,source:'THINK1 U2',mode:state.modeLabel||'',score:state.score||0,correct:state.correct||0,wrong:state.wrong||0,total:total,pct:pct};
  var btn=document.querySelector('button[onclick*="generateScoreCode"]');
  if(btn){btn.textContent='⏳ 提交中...';btn.disabled=true;}
  try{
    var resp=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(scoreData)});
    if(resp.ok){var data=await resp.json();if(data.success){
      var section=document.querySelector('.submit-section');
      if(section){section.innerHTML='<div style="padding:24px 16px;text-align:center;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:16px;"><div style="font-size:48px;margin-bottom:8px;">✅</div><div style="font-size:20px;font-weight:700;color:#2e7d32;margin-bottom:4px;">成绩已自动提交给老师！</div><div style="font-size:14px;color:#4caf50;">'+name+'，本次得分 '+pct+' 分（答对 '+state.correct+' / '+total+'）</div></div>';}
      return;
    }}
  }catch(e){}
  if(btn){btn.textContent='生成成绩码';btn.disabled=false;}
  const seconds=Math.round((Date.now()-state.startTime)/1000);
  const data2={n:name,u:'THINK1-U2',m:state.modeLabel,t:state.topicLabel,s:state.score,c:state.correct,w:state.wrong,total:state.currentQuestions.length,time:seconds,date:new Date().toISOString().slice(0,10)};
  const code='EP-'+btoa(unescape(encodeURIComponent(JSON.stringify(data2))));
  const output=document.getElementById('codeOutput'); output.textContent=code; output.style.display='block';
  document.getElementById('copyBtn').style.display='block'; output.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function copyScoreCode() {
  const code=document.getElementById('codeOutput').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>{const btn=document.getElementById('copyBtn');btn.textContent='✅ 已复制！发给你老师吧';setTimeout(()=>{btn.textContent='📋 复制成绩码';},2000);});}
  else{const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);const btn=document.getElementById('copyBtn');btn.textContent='✅ 已复制！';setTimeout(()=>{btn.textContent='📋 复制成绩码';},2000);}
}
function restartSameMode(){startExercise();}
function goHome(){
  state.currentIdx=0; state.currentQuestions=[];
  document.getElementById('contentArea').innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--c-text-light);"><div style="font-size:48px;">📚</div><p style="margin-top:12px;font-size:16px;">选择上方练习模式开始吧！</p><div class="grammar-tip" style="text-align:left;max-width:500px;margin:20px auto 0;"><strong>📖 本单元语法要点：</strong><br>1. 感官动词 + adj.：look/sound/smell/taste + adj.<br>2. a few vs few vs a little vs little<br>3. on one's own = by oneself<br>4. because + 句子 / because of + 名词词组<br>5. suggest doing sth.（不能说 suggest to do）<br>6. advise sb. to do sth.（advice 是名词，advise 是动词）<br>7. 现在进行时 vs 一般现在时<br>8. Action verbs vs Non-action verbs<br>9. other / the other / others / the others / another</div></div>`;
}

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); state.mode=btn.dataset.mode;
    state.modeLabel=btn.textContent.trim().split(' ')[1]||btn.textContent.trim(); startExercise();
  });
});
document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active'); state.topic=chip.dataset.topic; state.topicLabel=chip.textContent.trim(); startExercise();
  });
});

updateStars(); goHome();
</script>
<!-- auto-submit logic now inlined, no external JS needed -->
</body>
</html>
