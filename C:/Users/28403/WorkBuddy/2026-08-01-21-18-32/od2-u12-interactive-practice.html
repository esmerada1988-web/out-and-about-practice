<!DOCTYPE html>

<title>OD2 U12 词汇练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --c-bg: #f0f2f5;
    --c-card: #ffffff;
    --c-primary: #6C5CE7;
    --c-primary-light: #a29bfe;
    --c-primary-dark: #5849c4;
    --c-green: #00b894;
    --c-green-light: #e8f8f5;
    --c-red: #e74c3c;
    --c-red-light: #fdf2f2;
    --c-orange: #fdcb6e;
    --c-orange-dark: #e17055;
    --c-text: #2d3436;
    --c-text-light: #636e72;
    --c-border: #dfe6e9;
    --c-blue: #0984e3;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    min-height: 100vh;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    padding: 20px 16px;
    background: linear-gradient(135deg, var(--c-primary), var(--c-primary-light));
    border-radius: var(--radius);
    color: white;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { font-size: 13px; opacity: 0.85; }
  .badge {
    display: inline-block; font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 4px 12px; border-radius: 12px; margin-top: 8px;
  }
  .stars-display { text-align: center; font-size: 16px; margin-bottom: 12px; }
  .stars-display .star { color: var(--c-orange-dark); }
  .section-filters {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 0 12px; -webkit-overflow-scrolling: touch;
  }
  .filter-chip {
    padding: 8px 14px; border-radius: 20px;
    border: 2px solid var(--c-border); background: white;
    font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .filter-chip.active { border-color: var(--c-primary); background: var(--c-primary); color: white; }
  .filter-chip:hover:not(.active) { border-color: var(--c-primary-light); }
  .mode-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 8px 0; margin-bottom: 12px; -webkit-overflow-scrolling: touch;
  }
  .mode-btn {
    flex: 1; min-width: 100px; padding: 12px 8px;
    border-radius: 12px; border: 2px solid var(--c-border);
    background: white; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: center;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .mode-btn.active {
    border-color: var(--c-primary); background: var(--c-primary); color: white;
    transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108,92,231,0.3);
  }
  .mode-btn:hover:not(.active) { border-color: var(--c-primary-light); }
  .practice-area {
    background: var(--c-card); border-radius: var(--radius);
    padding: 24px 16px; box-shadow: var(--shadow); min-height: 400px;
  }
  .progress-bar {
    width: 100%; height: 8px; background: var(--c-border);
    border-radius: 4px; margin-bottom: 16px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--c-primary), var(--c-primary-light));
    border-radius: 4px; transition: width 0.3s;
  }
  .question-num { text-align: center; font-size: 13px; color: var(--c-text-light); margin-bottom: 12px; }
  .flashcard-container { perspective: 1000px; width: 100%; max-width: 400px; margin: 0 auto; }
  .flashcard {
    width: 100%; height: 220px; position: relative; cursor: pointer;
    transform-style: preserve-3d; transition: transform 0.6s; margin: 0 auto;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute; width: 100%; height: 100%;
    border-radius: var(--radius); display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .flashcard-front {
    background: linear-gradient(135deg, var(--c-primary), var(--c-primary-light)); color: white;
  }
  .flashcard-back {
    background: linear-gradient(135deg, var(--c-green), #55efc4); color: white;
    transform: rotateY(180deg);
  }
  .flashcard-word { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .flashcard-type { font-size: 13px; opacity: 0.8; }
  .flashcard-meaning { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .flashcard-example { font-size: 14px; opacity: 0.9; text-align: center; font-style: italic; }
  .flashcard-section { font-size: 12px; opacity: 0.7; margin-top: 8px; }
  .flashcard-hint { text-align: center; font-size: 13px; color: var(--c-text-light); margin: 12px 0; }
  .flashcard-actions { display: flex; gap: 12px; justify-content: center; }
  .flashcard-btn {
    padding: 12px 24px; border-radius: 24px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-dont { background: var(--c-red-light); color: var(--c-red); }
  .btn-know { background: var(--c-green-light); color: var(--c-green); }
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; margin: 0 auto; }
  .match-item {
    padding: 14px 10px; border-radius: 12px; border: 2px solid var(--c-border);
    background: white; text-align: center; cursor: pointer; font-size: 14px;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .match-item.selected { border-color: var(--c-primary); background: var(--c-primary); color: white; }
  .match-item.correct { border-color: var(--c-green); background: var(--c-green); color: white; }
  .match-item.wrong { border-color: var(--c-red); background: var(--c-red); color: white; }
  .fill-blank-question { font-size: 18px; text-align: center; margin-bottom: 20px; line-height: 1.8; }
  .blank {
    display: inline-block; min-width: 80px; padding: 4px 12px;
    border-bottom: 3px solid var(--c-primary); text-align: center;
    color: var(--c-primary); font-weight: 600; cursor: pointer;
  }
  .blank.filled { border-bottom-color: var(--c-green); }
  .blank.correct { border-bottom-color: var(--c-green); background: var(--c-green-light); }
  .blank.wrong { border-bottom-color: var(--c-red); background: var(--c-red-light); }
  .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .word-chip {
    padding: 8px 16px; border-radius: 20px; border: 2px solid var(--c-border);
    background: white; font-size: 14px; cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .word-chip.used { opacity: 0.4; pointer-events: none; }
  .mc-question { font-size: 18px; font-weight: 600; margin-bottom: 20px; text-align: center; }
  .mc-option {
    display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 12px; border: 2px solid var(--c-border); background: white;
    font-size: 15px; text-align: left; cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .mc-option:hover:not(.answered) { border-color: var(--c-primary-light); }
  .mc-option.correct { border-color: var(--c-green); background: var(--c-green-light); color: var(--c-green); }
  .mc-option.wrong { border-color: var(--c-red); background: var(--c-red-light); color: var(--c-red); }
  .so-translation { font-size: 18px; text-align: center; margin-bottom: 16px; color: var(--c-text); }
  .so-target {
    min-height: 60px; border: 2px dashed var(--c-border); border-radius: 12px;
    padding: 12px; margin-bottom: 16px; display: flex; flex-wrap: wrap;
    gap: 8px; align-items: center; justify-content: center;
    transition: border-color 0.3s;
  }
  .so-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .so-word {
    padding: 8px 14px; border-radius: 10px; background: var(--c-primary-light);
    color: var(--c-primary-dark); font-size: 14px; cursor: pointer;
    transition: background-color 0.15s;
  }
  .results-screen { text-align: center; padding: 20px 0; }
  .results-score { font-size: 56px; font-weight: 800; color: var(--c-primary); margin: 8px 0; }
  .results-score .total { font-size: 20px; color: var(--c-text-light); font-weight: 400; }
  .results-msg { font-size: 18px; margin: 8px 0 16px; font-weight: 600; }
  .results-detail { display: flex; justify-content: center; gap: 24px; margin: 16px 0; flex-wrap: wrap; }
  .results-stat { text-align: center; }
  .results-stat .num { font-size: 24px; font-weight: 700; }
  .results-stat .label { font-size: 12px; color: var(--c-text-light); }
  .wrong-list { text-align: left; margin-top: 16px; max-width: 500px; margin-left: auto; margin-right: auto; }
  .wrong-list h3 { font-size: 15px; margin-bottom: 8px; color: var(--c-red); }
  .wrong-item { background: rgba(231,76,60,0.08); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; font-size: 13px; }
  .wrong-item .correct-answer { color: var(--c-green); font-weight: 600; }
  .action-bar { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .action-btn {
    padding: 12px 28px; border-radius: 24px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-primary { background: var(--c-primary); color: white; }
  .btn-secondary { background: white; color: var(--c-primary); border: 2px solid var(--c-primary); }
  .submit-section {
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    border-radius: var(--radius); padding: 20px; margin-top: 24px;
    max-width: 500px; margin-left: auto; margin-right: auto;
  }
  .submit-section h3 { font-size: 16px; margin-bottom: 12px; color: var(--c-primary-dark); }
  .submit-section input {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    border: 2px solid var(--c-primary-light); font-size: 15px; margin-bottom: 10px; outline: none;

  .submit-section input:focus { border-color: var(--c-primary); }
  .code-output {
    background: #1e293b; color: #e2e8f0; border-radius: 12px; padding: 14px;
    font-size: 12px; word-break: break-all; margin-top: 10px; display: none;
    max-height: 120px; overflow-y: auto;
  }
  .copy-btn {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: var(--c-green); color: white; font-size: 15px;
    font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: background-color 0.15s;

    .flashcard-btn:hover,
    .match-item:hover,
    .word-chip:hover,
    .mc-option:hover,
    .so-word:hover,
    .action-btn:hover,
    .copy-btn:hover,
    .filter-chip:hover:not(.active) {
      transform: none !important;
      box-shadow: none !important;

</style>
</head>
<body>

<!-- ===== ACCESS GATE OVERLAY ===== -->
<div id="gateOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:24px;padding:36px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="font-size:48px;margin-bottom:12px;">👋</div>
    <h2 style="font-size:20px;margin-bottom:6px;color:#2d3436;font-weight:700;">学生验证</h2>
    <p style="font-size:13px;color:#636e72;margin-bottom:20px;line-height:1.5;">请输入你的名字进入练习</p>
    <input type="text" id="gateCodeInput" placeholder="输入你的名字" autocomplete="off" style="width:100%;padding:14px 16px;border:2px solid #dfe6e9;border-radius:14px;font-size:16px;text-align:center;outline:none;margin-bottom:10px;" onkeydown="if(event.key==='Enter')gateCheck()" onfocus="this.style.borderColor='#6C5CE7'" onblur="this.style.borderColor='#dfe6e9'" />
    <div id="gateError" style="color:#e74c3c;font-size:13px;margin-bottom:10px;display:none;min-height:18px;"></div>
    <button onclick="gateCheck()" id="gateBtn" style="width:100%;padding:14px;background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s;">进入练习</button>
    <p style="font-size:12px;color:#b2bec3;margin-top:16px;">名单中没有你的名字？请联系老师</p>
  </div>
</div>
<script>
(function(){
  var saved = sessionStorage.getItem('gate_ok');
  if (saved === 'yes') {
    var g = document.getElementById('gateOverlay');
    if (g) g.style.display = 'none';
    startNameAutofill();
    return;
  }
  setTimeout(function(){
    var inp = document.getElementById('gateCodeInput');
    if (inp) inp.focus();
  }, 200);
})();

function startNameAutofill(){
  var sn = sessionStorage.getItem('student_name');
  if(!sn) return;
  var tries = 0;
  var iv = setInterval(function(){
    var inp = document.getElementById('studentName');
    if(inp){
      if(!inp.value) inp.value = sn;
      clearInterval(iv);
    }
    if(++tries > 120) clearInterval(iv);
  }, 500);
}

function gateCheck(){
  var name = document.getElementById('gateCodeInput').value.trim();
  var errEl = document.getElementById('gateError');
  var btn = document.getElementById('gateBtn');
  if(!name){ errEl.textContent='请输入你的名字'; errEl.style.display='block'; return; }
  errEl.style.display='none'; btn.textContent='验证中...'; btn.style.opacity='0.7';
  fetch('/api/auth?name='+encodeURIComponent(name))
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.valid){
        sessionStorage.setItem('gate_ok','yes');
        sessionStorage.setItem('student_name', data.name || name);
        startNameAutofill();
        var g=document.getElementById('gateOverlay');
        if(g){g.style.transition='opacity 0.3s';g.style.opacity='0';setTimeout(function(){g.style.display='none';},300);}
      } else if(data.empty){
        errEl.textContent='老师尚未添加学生名单，请联系老师'; errEl.style.display='block';
        btn.textContent='进入练习'; btn.style.opacity='1';
      } else {
        errEl.textContent='名单中未找到你的名字，请联系老师'; errEl.style.display='block';
        btn.textContent='进入练习'; btn.style.opacity='1';
        document.getElementById('gateCodeInput').value=''; document.getElementById('gateCodeInput').focus();
      }
    })
    .catch(function(){
      errEl.textContent='网络错误，请检查网络后重试'; errEl.style.display='block';
      btn.textContent='进入练习'; btn.style.opacity='1';
    });
}
</script>

let state = {
  mode: 'flashcard',
  topic: 'all',
  currentQuestions: [],
  currentIdx: 0,
  score: 0,
  correct: 0,
  wrong: 0,
  wrongList: [],
  totalStars: parseInt(localStorage.getItem('od2_u12_stars') || '0'),
  answeredFlags: {},
  modeLabel: '',
  topicLabel: '全部',
  startTime: 0,
  matchSelected: null,
  matchCorrect: 0,
  fillAnswer: '',
  soTarget: [],
  lastResult: null
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getFilteredVocab() {
  return state.topic === 'all' ? vocabData : vocabData.filter(v => v.section === state.topic);
}
function getFilteredSentences() {
  return state.topic === 'all' ? sentenceData : sentenceData.filter(s => s.section === state.topic);
}
function getFilteredFillBlanks() {
  return state.topic === 'all' ? fillBlankData : fillBlankData.filter(f => f.section === state.topic);
}
function getFilteredMC() {
  return state.topic === 'all' ? mcData : mcData.filter(m => m.section === state.topic);
}
function updateStars() {
  document.getElementById('starCount').textContent = state.totalStars;
  localStorage.setItem('od2_u12_stars', state.totalStars);
}
function getDistractors(answer, type) {
  const all = vocabData.map(v => v.en).filter(w => w !== answer);
  return shuffle(all).slice(0, 4);
}

function startExercise() {
  state.currentIdx = 0;
  state.score = 0;
  state.correct = 0;
  state.wrong = 0;
  state.wrongList = [];
  state.startTime = Date.now();

  if (state.mode === 'flashcard') {
    state.currentQuestions = shuffle(getFilteredVocab());
    state.modeLabel = '翻卡记忆';
  } else if (state.mode === 'matching') {
    state.currentQuestions = shuffle(getFilteredVocab()).slice(0, 8);
    state.matchCorrect = 0;
    state.matchSelected = null;
    state.modeLabel = '连线匹配';
  } else if (state.mode === 'fillblank') {
    state.currentQuestions = shuffle(getFilteredFillBlanks());
    state.modeLabel = '填空题';
  } else if (state.mode === 'multiplechoice') {
    state.currentQuestions = shuffle(getFilteredMC());
    state.modeLabel = '选择题';
  } else if (state.mode === 'ordering') {
    state.currentQuestions = shuffle(getFilteredSentences());
    state.modeLabel = '句子排序';
  }

  renderQuestion();
}

function renderQuestion() {
  const area = document.getElementById('contentArea');
  if (state.currentIdx >= state.currentQuestions.length) {
    showResults();
    return;
  }
  const pct = Math.round((state.currentIdx / state.currentQuestions.length) * 100);
  const q = state.currentQuestions[state.currentIdx];

  let html = '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="question-num">第 ' + (state.currentIdx + 1) + ' / ' + state.currentQuestions.length + ' 题</div>';

  if (state.mode === 'flashcard') html += renderFlashcard(q);
  else if (state.mode === 'matching') html += renderMatching();
  else if (state.mode === 'fillblank') html += renderFillBlank(q);
  else if (state.mode === 'multiplechoice') html += renderMC(q);
  else if (state.mode === 'ordering') html += renderOrdering(q);

  area.innerHTML = html;
}

function renderFlashcard(q) {
  return '<div class="flashcard-container">'
    + '<div class="flashcard" id="fc" onclick="flipCard()">'
    + '<div class="flashcard-front">'
    + '<div class="flashcard-word">' + q.en + '</div>'
    + '<div class="flashcard-type">' + q.type + '</div>'
    + '<div class="flashcard-section">📖 ' + q.topic + '</div>'
    + '</div>'
    + '<div class="flashcard-back">'
    + '<div class="flashcard-meaning">' + q.zh + '</div>'
    + '<div class="flashcard-example">' + (q.example || '') + '</div>'
    + '<div class="flashcard-section">📖 ' + q.topic + '</div>'
    + '</div>'
    + '</div></div>'
    + '<div class="flashcard-hint">👆 点卡片翻转</div>'
    + '<div class="flashcard-actions">'
    + '<button class="flashcard-btn btn-dont" onclick="fcMarkWrong()">😕 不认识</button>'
    + '<button class="flashcard-btn btn-know" onclick="fcMarkRight()">😊 认识</button>'
    + '</div>';
}
function flipCard() {
  document.getElementById('fc').classList.toggle('flipped');
}
function fcMarkRight() {
  state.correct++; state.score++; state.totalStars++;
  updateStars(); state.currentIdx++; renderQuestion();
}
function fcMarkWrong() {
  const q = state.currentQuestions[state.currentIdx];
  state.wrong++;
  state.wrongList.push({q: q.en + ' → ' + q.zh, a: q.zh, mode: '翻卡'});
  state.currentIdx++; renderQuestion();
}

function renderMatching() {
  const pool = state.currentQuestions;
  const leftItems = shuffle(pool);
  const rightItems = shuffle(pool);
  let html = '<div class="match-grid">';
  html += '<div style="grid-column:1;">' + leftItems.map((q, i) =>
    '<div class="match-item" data-side="left" data-idx="' + i + '" data-value="' + q.en + '" onclick="matchClick(this)">' + q.en + '</div>'
  ).join('') + '</div>';
  html += '<div style="grid-column:2;">' + rightItems.map((q, i) =>
    '<div class="match-item" data-side="right" data-idx="' + i + '" data-value="' + q.zh + '" data-pair="' + q.en + '" onclick="matchClick(this)">' + q.zh + '</div>'
  ).join('') + '</div>';
  html += '</div>';
  return html;
}
function matchClick(el) {
  if (el.classList.contains('correct') || el.classList.contains('wrong')) return;
  if (!state.matchSelected) {
    state.matchSelected = el;
    el.classList.add('selected');
  } else {
    const prev = state.matchSelected;
    state.matchSelected = null;
    prev.classList.remove('selected');
    if (prev.dataset.value === el.dataset.pair || el.dataset.value === prev.dataset.pair) {
      prev.classList.add('correct');
      el.classList.add('correct');
      state.correct++; state.score++; state.totalStars++;
      updateStars();
      state.matchCorrect++;
      if (state.matchCorrect >= state.currentQuestions.length) {
        setTimeout(() => { state.currentIdx = state.currentQuestions.length; renderQuestion(); }, 800);
      }
    } else {
      prev.classList.add('wrong');
      el.classList.add('wrong');
      state.wrong++;
      state.wrongList.push({q: '配对错误', a: '', mode: '连线'});
      setTimeout(() => { prev.classList.remove('wrong'); el.classList.remove('wrong'); }, 600);
    }
  }
}

function renderFillBlank(q) {
  const parts = q.sentence.split('___');
  let html = '<div class="fill-blank-question">';
  parts.forEach((part, i) => {
    html += part;
    if (i < parts.length - 1) html += '<span class="blank" id="blank-' + i + '" onclick="clearBlank(' + i + ')">______</span>';
  });
  html += '</div>';
  if (q.hint) html += '<div style="text-align:center;font-size:13px;color:var(--c-primary);margin-top:8px;">💡 ' + q.hint + '</div>';
  const words = shuffle([q.answer, ...getDistractors(q.answer)]);
  html += '<div class="word-bank">';
  words.forEach(w => {
    html += '<span class="word-chip" onclick="fillWord(\'' + w.replace(/'/g, "\\'") + '\', this)">' + w + '</span>';
  });
  html += '</div>';
  html += `<div style="text-align:center;margin-top:16px;">
    <button class="action-btn btn-primary" onclick="checkFillBlank('${q.answer.replace(/'/g, "\\'")}')">✅ 确认</button>
  </div>`;
  return html;
}
let currentFillWord = '';
function fillWord(word, el) {
  document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
  el.classList.add('used');
  currentFillWord = word;
  const blank = document.getElementById('blank-0');
  if (blank) { blank.textContent = word; blank.classList.add('filled'); }
}
function clearBlank(idx) {
  const blank = document.getElementById('blank-' + idx);
  blank.textContent = '______';
  blank.classList.remove('filled');
  document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
  currentFillWord = '';
}
function checkFillBlank(answer) {
  const blank = document.getElementById('blank-0');
  if (!blank || !blank.classList.contains('filled')) { alert('请先选择一个答案'); return; }
  const userAnswer = blank.textContent;
  if (userAnswer.toLowerCase() === answer.toLowerCase()) {
    blank.classList.add('correct');
    state.correct++; state.score++; state.totalStars++;
    updateStars();
    setTimeout(() => { state.currentIdx++; renderQuestion(); }, 1000);
  } else {
    blank.classList.add('wrong');
    state.wrong++;
    state.wrongList.push({q: '填空: ' + state.currentQuestions[state.currentIdx].sentence, a: answer, mode: '填空'});
    setTimeout(() => {
      blank.textContent = answer;
      blank.classList.remove('wrong');
      blank.classList.add('correct');
      setTimeout(() => { state.currentIdx++; renderQuestion(); }, 1500);
    }, 1200);
  }
}

function renderMC(q) {
  let html = '<div class="mc-question">' + q.q + '</div>';
  q.options.forEach((opt, i) => {
    html += '<button class="mc-option" onclick="checkMC(' + i + ', ' + q.answer + ', this)">' + opt + '</button>';
  });
  return html;
}
function checkMC(selected, correct, el) {
  document.querySelectorAll('.mc-option').forEach(o => o.classList.add('answered'));
  if (selected === correct) {
    el.classList.add('correct');
    state.correct++; state.score++; state.totalStars++;
    updateStars();
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.mc-option')[correct].classList.add('correct');
    state.wrong++;
    state.wrongList.push({q: state.currentQuestions[state.currentIdx].q, a: state.currentQuestions[state.currentIdx].options[correct], mode: '选择'});
  }
  setTimeout(() => { state.currentIdx++; renderQuestion(); }, 1500);
}

function renderOrdering(q) {
  state.soTarget = [];
  const shuffled = shuffle(q.words);
  let html = '<div class="so-translation">💬 ' + q.zh + '</div>';
  html += '<div class="so-target" id="soTarget"></div>';
  html += '<div class="so-bank" id="soBank">';
  shuffled.forEach((w, i) => {
    html += '<span class="so-word" data-word="' + w + '" data-idx="' + i + '" onclick="moveToTarget(' + i + ')">' + w + '</span>';
  });
  html += '</div>';
  html += '<div style="text-align:center;margin-top:16px;">'
    + '<button class="action-btn btn-primary" onclick="checkOrdering()">✅ 确认</button>'
    + '<button class="action-btn btn-secondary" onclick="resetOrdering()">🔄 重置</button>'
    + '</div>';
  return html;
}
function moveToTarget(bankIdx) {
  const el = document.querySelector('.so-word[data-idx="' + bankIdx + '"]');
  if (!el || el.classList.contains('in-target')) return;
  const word = el.dataset.word;
  state.soTarget.push(word);
  el.classList.add('in-target');
  el.style.visibility = 'hidden';
  renderTarget();
}
function removeFromTarget(idx) {
  const word = state.soTarget[idx];
  state.soTarget.splice(idx, 1);
  const els = document.querySelectorAll('.so-word');
  els.forEach(el => {
    if (el.dataset.word === word && el.classList.contains('in-target')) {
      el.classList.remove('in-target');
      el.style.visibility = 'visible';
    }
  });
  renderTarget();
}
function renderTarget() {
  const target = document.getElementById('soTarget');
  if (state.soTarget.length === 0) {
    target.innerHTML = '<span style="color:var(--c-text-light);font-size:13px;">点下方单词组句</span>';
    return;
  }
  target.innerHTML = state.soTarget.map((w, i) =>
    '<span class="so-word" style="background:var(--c-green);color:white;" onclick="removeFromTarget(' + i + ')">' + w + '</span>'
  ).join('');
}
function checkOrdering() {
  const q = state.currentQuestions[state.currentIdx];
  const userAnswer = state.soTarget.join(' ');
  const correctAnswer = q.words.join(' ');
  if (userAnswer === correctAnswer) {
    state.correct++; state.score++; state.totalStars++;
    updateStars();
    document.getElementById('soTarget').style.borderColor = 'var(--c-green)';
    setTimeout(() => { state.currentIdx++; renderQuestion(); }, 1200);
  } else {
    document.getElementById('soTarget').style.borderColor = 'var(--c-red)';
    state.wrong++;
    state.wrongList.push({q: '排序: ' + q.zh, a: correctAnswer, mode: '排序'});
    setTimeout(() => {
      state.soTarget = [...q.words];
      renderTarget();
      document.getElementById('soTarget').style.borderColor = 'var(--c-green)';
      setTimeout(() => { state.currentIdx++; renderQuestion(); }, 1500);
    }, 1500);
  }
}
function resetOrdering() {
  state.soTarget = [];
  document.querySelectorAll('.so-word').forEach(el => {
    el.classList.remove('in-target');
    el.style.visibility = 'visible';
  });
  renderTarget();
}

function showResults() {
  const area = document.getElementById('contentArea');
  const total = state.currentQuestions.length;
  const pct = total > 0 ? Math.round((state.correct / total) * 100) : 0;

  state.lastResult = {
    correct: state.correct,
    wrong: state.wrong,
    score: pct,
    total: total,
    pct: pct,
    mode: state.modeLabel || '',
    source: 'OD2 U12'
  };

  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : pct >= 40 ? '💪' : '📖';
  const msg = pct >= 80 ? '太棒了！' : pct >= 60 ? '不错！继续加油！' : pct >= 40 ? '还需练习哦！' : '多看几遍词汇卡吧！';

  let wrongHtml = '';
  if (state.wrongList.length > 0) {
    wrongHtml = '<div class="wrong-list"><h3>❌ 错题回顾</h3>';
    state.wrongList.forEach(w => {
      wrongHtml += '<div class="wrong-item">' + w.q + ' → <span class="correct-answer">' + w.a + '</span></div>';
    });
    wrongHtml += '</div>';
  }

  const seconds = Math.round((Date.now() - state.startTime) / 1000);
  const timeStr = Math.floor(seconds/60) + '分' + seconds%60 + '秒';

  area.innerHTML = '<div class="results-screen">'
    + '<div style="font-size:48px;">' + emoji + '</div>'
    + '<div class="results-score">' + pct + '<span class="total">分</span></div>'
    + '<div class="results-msg">' + msg + '</div>'
    + '<div class="results-detail">'
    + '<div class="results-stat"><div class="num" style="color:var(--c-green)">' + state.correct + '</div><div class="label">答对</div></div>'
    + '<div class="results-stat"><div class="num" style="color:var(--c-red)">' + state.wrong + '</div><div class="label">答错</div></div>'
    + '<div class="results-stat"><div class="num" style="color:var(--c-orange)">+' + state.score + '</div><div class="label">本轮⭐</div></div>'
    + '<div class="results-stat"><div class="num" style="color:var(--c-purple)">' + state.totalStars + '</div><div class="label">总⭐</div></div>'
    + '<div class="results-stat"><div class="num" style="color:var(--c-blue)">' + timeStr + '</div><div class="label">用时</div></div>'
    + '</div>'
    + wrongHtml
    + '<div class="submit-section">'
    + '<h3>📤 提交成绩给老师</h3>'
    + '<input type="text" id="studentName" placeholder="输入你的姓名" />'
    + '<button class="copy-btn" onclick="generateScoreCode()">📤 提交成绩给老师</button>'
    + '<div class="code-output" id="codeOutput"></div>'
    + '<button class="copy-btn" id="copyBtn" style="display:none;background:var(--c-blue);" onclick="copyScoreCode()">📋 复制成绩码</button>'
    + '</div>'
    + '<div class="action-bar">'
    + '<button class="action-btn btn-secondary" onclick="restartSameMode()">🔄 再练一次</button>'
    + '<button class="action-btn btn-primary" onclick="goHome()">🏠 返回首页</button>'
    + '</div>'
    + '</div>';
}

async function generateScoreCode() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) { alert('请输入姓名'); return; }
  var snap = state.lastResult || {};
  var total = (snap.correct || 0) + (snap.wrong || 0);
  var pct = snap.pct || (total > 0 ? Math.round(snap.correct / total * 100) : 0);
  var scoreData = {
    name: name, source: snap.source || 'OD2 U12', mode: snap.mode || '',
    score: snap.score || pct, correct: snap.correct || 0,
    wrong: snap.wrong || 0, total: snap.total || total, pct: pct
  };
  var btn = document.querySelector('button[onclick*="generateScoreCode"]');
  if (btn) { btn.textContent = '⏳ 提交中...'; btn.disabled = true; }
  try {
    var resp = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(scoreData)
    });
    if (resp.ok) {
      var data = await resp.json();
      if (data.success) {
        var section = document.querySelector('.submit-section');
        if (section) {
          section.innerHTML = '<div style="padding:24px 16px;text-align:center;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:16px;">'
            + '<div style="font-size:48px;margin-bottom:8px;">✅</div>'
            + '<div style="font-size:20px;font-weight:700;color:#2e7d32;margin-bottom:4px;">成绩已自动提交给老师！</div>'
            + '<div style="font-size:14px;color:#4caf50;">' + name + '，本次得分 ' + pct + ' 分（答对 ' + (snap.correct||0) + ' / ' + total + '）</div></div>';
        }
        return;
      }
    }
  } catch (e) {}
  if (btn) { btn.textContent = '生成成绩码'; btn.disabled = false; }
  const data2 = {
    n: name, u: 'OD2U12', m: snap.mode, t: state.topicLabel,
    s: snap.score || pct, c: snap.correct, w: snap.wrong,
    total: snap.total, date: new Date().toISOString().slice(0, 10)
  };
  const code = 'EP-' + btoa(unescape(encodeURIComponent(JSON.stringify(data2))));
  const output = document.getElementById('codeOutput');
  output.textContent = code;
  output.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'block';
  output.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function copyScoreCode() {
  const code = document.getElementById('codeOutput').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已复制！发给老师吧';
      setTimeout(() => { btn.textContent = '📋 复制成绩码'; }, 2000);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制！';
    setTimeout(() => { btn.textContent = '📋 复制成绩码'; }, 2000);
  }
}

function restartSameMode() { startExercise(); }
function goHome() {
  document.getElementById('contentArea').innerHTML = '<div style="text-align:center;color:var(--c-text-light);padding:40px 0;">选择上方模式和章节，开始练习！</div>';
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    state.mode = this.dataset.mode;
    startExercise();
  });
});

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    state.topic = this.dataset.topic;
    state.topicLabel = this.textContent;
  });
});
</script>
</body>
</html>
